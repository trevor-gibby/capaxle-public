# Install this reviewed template into the public repository separately.
# The private-to-public source mirror must not update workflows.
name: Publish approved alpha

on:
  workflow_dispatch:

run-name: Prepare alpha release from ${{ github.sha }}

permissions:
  contents: read

concurrency:
  group: ${{ github.repository }}-npm-publish
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      plan_sha256: ${{ steps.plan.outputs.plan_sha256 }}
      mirror_commit: ${{ steps.plan.outputs.mirror_commit }}
      artifact_id: ${{ steps.artifact.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org/
      - name: Pin pack toolchain
        run: npm install --global npm@10.9.2
      - name: Install and build public source
        run: |
          npm ci --ignore-scripts
          npm run build
      - name: Pack and check all eleven packages
        run: node tooling/public-release/release.mjs pack
      - name: Enable registry signature audit
        run: npm install --global npm@11.5.1
      - name: Freeze exact release record for owner review
        id: plan
        run: node tooling/public-release/release.mjs prepare
      - name: Preserve this run's exact record and tarballs
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: npm-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: .release/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: prepare
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 60
    env:
      RELEASE_PLAN_SHA256: ${{ needs.prepare.outputs.plan_sha256 }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.mirror_commit }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org/
      - name: Retrieve the immutable same-run release artifact
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.prepare.outputs.artifact_id }}
          merge-multiple: true
          path: .release/
      - name: Enable npm trusted publishing CLI
        run: npm install --global npm@11.5.1
      - name: Recheck approved record and publish only its missing packages
        run: node tooling/public-release/release.mjs publish
